<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Afnan Rewards - customer journey</title>
<style>
  @page { size: 297mm 210mm; margin: 0; }
  html, body { margin: 0; background: #fff; }
  body { font-family: "Segoe UI", Arial, sans-serif; }
  svg { display: block; width: 297mm; height: 199mm; }
  .box { fill: #fff; stroke: #1c2233; stroke-width: 1.6; }
  .gold { fill: #f8e9bd; stroke: #b0852a; }
  .navy { fill: #1c2233; stroke: #1c2233; }
  .silver { fill: #e6e8ec; stroke: #8b93a1; }
  .goldtier { fill: #f3dfa8; stroke: #b0852a; }
  .plat { fill: #1c2233; stroke: #1c2233; }
  .soft { fill: #f5f6f8; stroke: #c7ccd6; stroke-width: 1; }
  .t { font-size: 15px; fill: #1c2233; text-anchor: middle; }
  .tb { font-size: 15px; font-weight: 700; fill: #1c2233; text-anchor: middle; }
  .ts { font-size: 12.5px; fill: #4a5163; text-anchor: middle; }
  .tw { font-size: 15px; font-weight: 700; fill: #fff; text-anchor: middle; }
  .tws { font-size: 12.5px; fill: #d9dde8; text-anchor: middle; }
  .h { font-size: 17px; font-weight: 700; letter-spacing: 1.5px; fill: #1c2233; }
  .title { font-size: 30px; font-weight: 700; fill: #1c2233; letter-spacing: 1px; }
  .sub { font-size: 15px; fill: #4a5163; }
  .num { fill: #1c2233; }
  .numt { font-size: 17px; font-weight: 700; fill: #fff; text-anchor: middle; }
  .arrow { stroke: #1c2233; stroke-width: 2; fill: none; marker-end: url(#a); }
  .loop { stroke: #b0852a; stroke-width: 2; fill: none; stroke-dasharray: 7 5; marker-end: url(#g); }
  .lbl { font-size: 12.5px; fill: #8a6a1f; font-style: italic; text-anchor: middle; }
  .panel-h { font-size: 15px; font-weight: 700; fill: #1c2233; letter-spacing: 1px; }
  .li { font-size: 14.5px; fill: #2a3042; }
</style>
</head>
<body>
<svg viewBox="0 0 1400 940" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Afnan Rewards customer journey: sign up, earn points, tiers, redeem at checkout">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1c2233"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b0852a"/>
    </marker>
  </defs>

  <text x="50" y="56" class="title">AFNAN REWARDS - CUSTOMER JOURNEY</text>
  <text x="50" y="84" class="sub">Loyalty programme flow: sign up, earn points, move between tiers, redeem at checkout</text>

  <!-- Column headers -->
  <g>
    <circle cx="68" cy="140" r="17" class="num"/><text x="68" y="146" class="numt">1</text>
    <text x="96" y="146" class="h">SIGN UP</text>
    <circle cx="378" cy="140" r="17" class="num"/><text x="378" y="146" class="numt">2</text>
    <text x="406" y="146" class="h">EARN POINTS</text>
    <circle cx="808" cy="140" r="17" class="num"/><text x="808" y="146" class="numt">3</text>
    <text x="836" y="146" class="h">TIERS</text>
    <circle cx="1098" cy="140" r="17" class="num"/><text x="1098" y="146" class="numt">4</text>
    <text x="1126" y="146" class="h">REDEEM</text>
  </g>

  <!-- 1. Sign up -->
  <rect x="40" y="170" width="250" height="84" rx="10" class="box"/>
  <text x="165" y="205" class="tb">Visitor opens the store</text>
  <text x="165" y="228" class="ts">or the Rewards landing page</text>

  <rect x="40" y="300" width="250" height="84" rx="10" class="box"/>
  <text x="165" y="335" class="tb">Creates a free account</text>
  <text x="165" y="358" class="ts">email or social login</text>

  <rect x="40" y="430" width="250" height="84" rx="10" class="gold"/>
  <text x="165" y="465" class="tb">Welcome bonus</text>
  <text x="165" y="488" class="t">+100 points</text>
  <text x="165" y="508" class="ts" font-size="11">starts at Silver tier</text>

  <path d="M165,254 L165,298" class="arrow"/>
  <path d="M165,384 L165,428" class="arrow"/>

  <!-- 2. Earn -->
  <rect x="345" y="170" width="200" height="104" rx="10" class="box"/>
  <text x="445" y="205" class="tb">Purchase</text>
  <text x="445" y="229" class="t">1 point per AED 1</text>
  <text x="445" y="252" class="ts">x1.25 Gold, x1.5 Platinum</text>

  <rect x="565" y="170" width="200" height="104" rx="10" class="box"/>
  <text x="665" y="205" class="tb">Review</text>
  <text x="665" y="229" class="t">+50 points</text>
  <text x="665" y="252" class="ts">+100 with a photo</text>

  <rect x="345" y="300" width="200" height="104" rx="10" class="box"/>
  <text x="445" y="335" class="tb">Birthday</text>
  <text x="445" y="359" class="t">+100 to +300 points</text>
  <text x="445" y="382" class="ts">once a year, by tier</text>

  <rect x="565" y="300" width="200" height="104" rx="10" class="box"/>
  <text x="665" y="335" class="tb">Referral</text>
  <text x="665" y="359" class="t">+300 points</text>
  <text x="665" y="382" class="ts">friend's first order</text>

  <rect x="345" y="430" width="420" height="84" rx="10" class="gold"/>
  <text x="555" y="465" class="tb">Points balance and lifetime points</text>
  <text x="555" y="490" class="ts">shown in My Loyalty. Lifetime points set the tier</text>

  <path d="M290,472 L343,472" class="arrow"/>
  <path d="M445,274 L445,298" class="arrow"/>
  <path d="M665,274 L665,298" class="arrow"/>
  <path d="M555,404 L555,428" class="arrow"/>

  <!-- 3. Tiers -->
  <rect x="790" y="170" width="260" height="104" rx="10" class="plat"/>
  <text x="920" y="203" class="tw">PLATINUM  3,000+ pts</text>
  <text x="920" y="227" class="tws">x1.5 points, free delivery always,</text>
  <text x="920" y="248" class="tws">gift + 300 birthday points, exclusives</text>

  <rect x="790" y="300" width="260" height="104" rx="10" class="goldtier"/>
  <text x="920" y="333" class="tb">GOLD  1,000+ pts</text>
  <text x="920" y="357" class="ts">x1.25 points, free delivery over AED 50,</text>
  <text x="920" y="378" class="ts">early access, 200 birthday points</text>

  <rect x="790" y="430" width="260" height="104" rx="10" class="silver"/>
  <text x="920" y="463" class="tb">SILVER  0+ pts</text>
  <text x="920" y="487" class="ts">x1 points, free delivery over AED 100,</text>
  <text x="920" y="508" class="ts">100 birthday points</text>

  <path d="M920,430 L920,406" class="arrow"/>
  <path d="M920,300 L920,276" class="arrow"/>
  <text x="1008" y="418" class="lbl" text-anchor="start" transform="translate(-30,0)">reach 1,000</text>
  <text x="1008" y="288" class="lbl" text-anchor="start" transform="translate(-30,0)">reach 3,000</text>

  <path d="M765,472 L788,472" class="arrow"/>

  <!-- 4. Redeem -->
  <rect x="1090" y="170" width="270" height="84" rx="10" class="box"/>
  <text x="1225" y="205" class="tb">Customer checks balance</text>
  <text x="1225" y="228" class="ts">My Loyalty page / account widget</text>

  <rect x="1090" y="300" width="270" height="84" rx="10" class="box"/>
  <text x="1225" y="335" class="tb">Chooses a reward</text>
  <text x="1225" y="358" class="ts">100 points = AED 10 (min 200)</text>

  <rect x="1090" y="430" width="270" height="84" rx="10" class="gold"/>
  <text x="1225" y="465" class="tb">Discount code at checkout</text>
  <text x="1225" y="488" class="ts">applied to the order total</text>

  <rect x="1090" y="560" width="270" height="84" rx="10" class="navy"/>
  <text x="1225" y="595" class="tw">Order placed</text>
  <text x="1225" y="618" class="tws">points are deducted, new points earned</text>

  <path d="M1225,254 L1225,298" class="arrow"/>
  <path d="M1225,384 L1225,428" class="arrow"/>
  <path d="M1225,514 L1225,558" class="arrow"/>
  <path d="M440,514 L440,556 L1070,556 L1070,212 L1088,212" class="arrow"/>
  <text x="900" y="574" class="lbl">spendable balance goes to redeem</text>

  <!-- loop back to earn -->
  <path d="M1090,610 L690,610 L690,516" class="loop"/>
  <text x="890" y="630" class="lbl">every order earns again, the cycle repeats</text>

  <!-- Bottom panels -->
  <rect x="40" y="690" width="640" height="215" rx="12" class="soft"/>
  <text x="62" y="722" class="panel-h">BUILT IN THE THEME (storefront)</text>
  <text x="62" y="752" class="li">- Loyalty landing page: how it works in 3 steps, tier table, ways to earn, sign-up</text>
  <text x="62" y="778" class="li">- My Loyalty page: points balance, tier and progress bar to the next tier</text>
  <text x="62" y="804" class="li">- Tier thresholds and copy as theme settings and translations (English / Arabic)</text>
  <text x="62" y="830" class="li">- Presentation only: the theme never decides who earns or spends points</text>

  <rect x="720" y="690" width="640" height="215" rx="12" class="soft"/>
  <text x="742" y="722" class="panel-h">HANDLED BY THE LOYALTY APP</text>
  <text x="742" y="752" class="li">- Points ledger: earn, spend, expire. One source of truth, with an audit trail</text>
  <text x="742" y="778" class="li">- Earn rules: purchase, review, birthday, referral, and fraud checks</text>
  <text x="742" y="804" class="li">- Tier logic and automatic tier changes, plus emails and reminders</text>
  <text x="742" y="830" class="li">- Redemption: creates the discount code applied at checkout</text>
</svg>
</body>
</html>
